# ABOUTME: Builds Dockerfile.freiburg and pushes it to GHCR on release or manual dispatch.
# ABOUTME: The image is used interactively on the server for the tree import (README-FREIBURG.md).
name: Docker Image (GHCR)

env:
  IMAGE: ghcr.io/${{ github.repository }}

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the source
        uses: actions/checkout@v4
      - name: Login to GHCR, build and push
        env:
          TAG: ${{ github.event.release.tag_name || github.sha }}
          LATEST: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build \
            -f Dockerfile.freiburg \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label version="$TAG" \
            --tag "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"
          if [ "$LATEST" = "true" ]; then
            docker tag "$IMAGE:$TAG" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
